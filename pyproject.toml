[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-algo-trader"
version = "2.0.0"
description = "Autonomous NSE trading organism — six segment holons under a portfolio supervisor"
requires-python = ">=3.12"
dependencies = [
  # broker + auth (the three retained survivors depend on these)
  "kiteconnect",
  "pyotp",
  "requests",
  "python-dotenv",
  # numerics
  # UPPER BOUND, added 2026-08-16, and it is load-bearing rather than cautious. Installing
  # `scipy-stubs` silently pulled numpy 2.4.6 -> 2.5.2, and numpy 2.5's "generic unit for NumPy
  # timedelta is deprecated" warning fires inside `exchange_calendars` at IMPORT time, on its own
  # `pd.Timedelta("1h")`. With `filterwarnings = error` that is not a warning, it is 13 collection
  # errors, and it is in a third-party import so there is nothing here to fix. `numba` independently
  # requires numpy<2.5. Raise this only when `exchange_calendars` stops emitting it.
  "numpy<2.5",
  "pandas",
  "scipy",
  # models
  "scikit-learn",
  "lightgbm",
  "statsmodels",
  "arch",
  "hmmlearn",
  "river",
  "shap",
  # optimisation
  "cvxpy",
  # indicators
  "TA-Lib",
  "pandas-ta-classic",
  # scanning / storage
  "polars",
  "duckdb",
  # service
  "fastapi",
  "uvicorn",
  "matplotlib",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "hypothesis",
  "ruff",
  "mypy",
  # Type information for scipy, added 2026-08-16 for `A.123`'s beta-binomial tests. Not cosmetic:
  # with scipy untyped, EVERY scipy call in this repo resolved to `Any` and none was checked.
  # Installing these immediately surfaced two real defects in `exchange_clock_offset_estimator` —
  # an `linprog` method passed as a bare `str` (a typo would have failed at runtime inside the
  # fit) and `solution.x` indexed without checking it is not `None`. Same argument as bringing
  # `scripts/` into the gate after `A.65`.
  "scipy-stubs",
  # Pinned to the numpy-2.4 variant. `scipy-stubs` pulls this transitively and its default release
  # DEMANDS numpy>=2.5rc1, which is what dragged numpy forward and broke collection above. The
  # package publishes one release per numpy minor; this is the one matching the pin.
  "numpy-typing-compat==20260602.2.4",
  # A differential-test ORACLE, never a runtime dependency: `L0.22`'s trade classifier is
  # checked against tclf's Lee-Ready on random books, and it found a real defect on its
  # first run (`research/214` §6). Pinned to git main because the PyPI artifact (0.0.9,
  # 2024-02-18) predates scikit-learn 1.6 removing `BaseEstimator._validate_data` and
  # raises `AttributeError` on `fit()` against the 1.9.0 installed here.
  "tclf @ git+https://github.com/KarelZe/tclf.git@main",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff — the static half of the R.23 execution gate.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # import sorting
  "N",           # pep8-naming — supports R.14 self-describing names
  "UP",          # pyupgrade
  "B",           # bugbear
  "A",           # builtin shadowing
  "C4",          # comprehensions
  "SIM",         # simplification
  "ARG",         # unused arguments
  "PTH",         # pathlib over os.path
  "RUF",
  "TRY",         # exception antipatterns
  "BLE",         # blind except — R.23(e): never swallow errors silently
  "S",           # bandit security
  "DTZ",         # naive datetimes — IST/UTC correctness is a financial requirement
  "NPY", "PD",
  "PLR2004",     # magic-value comparisons (partial cover for R.03; see research/200)
]
ignore = [
  "TRY003",  # long messages inside raise — we want them explicit
  "S101",    # assert: allowed, tests rely on it
]

[tool.ruff.lint.per-file-ignores]
# PLR2004 exempted in tests deliberately: an expected value IS the test. Naming every
# literal `EXPECTED_...` adds ceremony, not safety, and the churn was measurable.
# It stays ON for src/, where an unexplained constant is the R.03 defect it exists to catch.
"tests/*" = ["S", "ARG", "PD901", "PLR2004"]
"tests/fixtures_rupee_literal_evasions/*" = ["ALL"]  # deliberate violations, by design

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = ["types"]

# ---------------------------------------------------------------------------
# Mypy — strict. Signatures come before bodies (R.23 loop, step 2).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = "scripts"
# scripts/ is the OPERATIONAL SPINE and was outside the gate entirely, so every
# import there resolved to Any and no call was checked. That is exactly how
# `store.ingest(..., observed_on=...)` shipped against a method taking `ingested_on`
# and failed on every scheduled run (A.65).
exclude = ["tests/fixtures_rupee_literal_evasions/"]
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

# pandas_market_calendars ships no type stubs and none exist on typeshed. It is the
# only NSE session source that works (exchange_calendars has no NSE at all), so the
# untyped import is accepted at this one boundary rather than losing the calendar.
# Everything the project does with it is wrapped in nse_trading_session_calendar.py,
# which is fully typed.
[[tool.mypy.overrides]]
module = [
  "pandas_market_calendars.*", "staircase.*", "nselib.*",
  # Broker SDKs ship no type information. Wrapped at a single adapter each
  # (historical_bars/), so the untyped surface is one file per broker.
  "SmartApi.*", "breeze_connect.*", "upstox_client.*", "growwapi.*", "fyers_apiv3.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "kiteconnect.*", "pyotp.*", "talib.*", "pandas_ta_classic.*",
  "lightgbm.*", "hmmlearn.*", "river.*", "shap.*", "arch.*",
  "cvxpy.*", "statsmodels.*", "duckdb.*", "sklearn.*",
  "pyarrow.*",
  # vollib carries Jaeckel's "Let's Be Rational" IV inversion and ships no py.typed.
  # Wrapped behind ONE adapter (option_analytics/), so the untyped surface is a single file.
  "vollib.*", "py_lets_be_rational.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest — R.23 loop step 3. Markers name the test KINDS the rule requires.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `scripts/` on the path so a test can import the OPERATIONAL entry points, matching
# `mypy_path = "scripts"` above. Without this they resolve under two module names and mypy reports
# "Source file found twice". Added 2026-08-16 when the `A.125` review found the paper loop's
# admission decision untested — three mutations of it survived the whole suite.
pythonpath = ["scripts"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "unit: isolated behaviour of one unit",
  "property: property-based invariant (hypothesis)",
  "adversarial: degenerate, hostile or boundary input",
  "real_data: runs against REAL market data — the R.05 gate",
  "hermetic: injected fake behind a DI seam (R.05); never substitutes for real_data",
  "market_gated: needs an open market session; expected to skip out of hours",
]
filterwarnings = ["error::DeprecationWarning"]
